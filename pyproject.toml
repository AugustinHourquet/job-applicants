[project]
name = "job-applicants"
version = "0.1.0"
description = "Interpretability, stability and algorithmic fairness on the 70k+ Job Applicants dataset (HEC Paris, Fall 2026)."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # data
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "pyyaml>=6",
    "pydantic>=2.7,<3",
    "kagglehub>=0.3.6",
    # models
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "tabpfn>=2.0,<3",
    "torch>=2.4",
    "joblib>=1.4",
    "scipy>=1.13",
    # interpretability
    "shap>=0.46",
    # app + figures
    "streamlit>=1.38,<2",
    "plotly>=5.24,<7",
    "kaleido>=0.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# Keep the Linux (Docker) image small: the default PyPI torch wheel pulls the
# entire CUDA stack (~2.5GB) which is useless on a CPU-only container. On macOS
# the default wheel is already CPU/MPS, so it is left alone.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: full-pipeline runs; deselect with -m 'not slow'",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
